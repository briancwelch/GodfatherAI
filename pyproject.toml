[project]
name = "the-godfather"
version = "0.1.0"
description = "Local development tooling for The Godfather monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "types-psutil>=7.2,<8",
]

[tool.uv]
package = false
# Lock the isolated wheel-build toolchain as well as application dependencies.
require-build-hashes = true
build-constraint-dependencies = [
    { requirement = "editables==0.6", hashes = ["sha256:1163834902381c4613787951c5914800fdf155ae08848a373b8ea5006780977c", "sha256:d70e4698078a1d033e7786d9c64e5be070d058a67c21417024d38a58ac20aa43"] },
    { requirement = "hatchling==1.32.4", hashes = ["sha256:08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c", "sha256:c4468f73144c054d2aab4ef0f0378c43b9878bf07f8ffd6b79690e970d375f07"] },
    { requirement = "packaging==26.3", hashes = ["sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79", "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
    { requirement = "pathspec==1.1.1", hashes = ["sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a", "sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
    { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec", "sha256:d1eaa46ebb595891b860ab086b4d09c8588af65ebd4361b8e8f4bb8920b90ba8"] },
    { requirement = "tomlkit==0.15.2", hashes = ["sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437", "sha256:83e32755ba1d20d9340bd069ee97e9f6232ba2346b63ffcba425de01f7e327a6"] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71", "sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
]

[tool.uv.workspace]
members = ["apps/api", "packages/shared-schemas", "packages/worker", "packages/model-gateway", "packages/agent-runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["apps/api/src", "packages", "infrastructure/migrations", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
markers = ["integration: requires an explicitly configured disposable PostgreSQL test database"]
