[project]
name = "the-godfather"
version = "0.1.0"
description = "Local development tooling for The Godfather monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
