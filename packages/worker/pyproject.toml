[project]
name = "godfather-worker"
version = "0.1.0"
description = "Outbound-only registration and health worker; no task execution"
requires-python = ">=3.12"
dependencies = [
    "godfather-contracts",
    "godfather-model-gateway",
    "godfather-agent-runtime",
    "psutil>=7.2,<8",
    "keyring>=25,<26",
    "pystray>=0.19.5,<0.20",
    "Pillow>=12,<13",
]

[project.scripts]
godfather-worker = "godfather_worker.launcher:main"
godfather-worker-cli = "godfather_worker.cli:main"
godfather-worker-provider = "godfather_worker.provider_credentials:main"

[tool.uv.sources]
godfather-agent-runtime = { workspace = true }
godfather-contracts = { workspace = true }
godfather-model-gateway = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godfather_worker"]
