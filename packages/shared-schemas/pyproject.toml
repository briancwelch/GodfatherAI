[project]
name = "godfather-contracts"
version = "0.1.0"
description = "Versioned portable worker registration and health contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godfather_contracts"]
