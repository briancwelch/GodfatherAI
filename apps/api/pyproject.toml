[project]
name = "godfather-api"
version = "0.1.0"
description = "The Godfather control-plane API"
requires-python = ">=3.12"
dependencies = [
    "godfather-agent-runtime",
    "godfather-contracts",
    "alembic>=1.16,<2",
    "fastapi>=0.121,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "authlib>=1.9.1,<2",
    "cryptography>=50,<51",
    "httpx2>=2.13,<3",
]

[tool.uv.sources]
godfather-agent-runtime = { workspace = true }
godfather-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godfather_api"]
