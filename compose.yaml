name: godfather-local

x-api-environment: &api-environment
  GODFATHER_DATABASE_HOST: postgres
  GODFATHER_DATABASE_NAME: godfather
  GODFATHER_DATABASE_USER: godfather
  GODFATHER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
  GODFATHER_HEARTBEAT_INTERVAL_SECONDS: ${GODFATHER_HEARTBEAT_INTERVAL_SECONDS:-10}
  GODFATHER_SUSPECT_AFTER_SECONDS: ${GODFATHER_SUSPECT_AFTER_SECONDS:-20}
  GODFATHER_OFFLINE_AFTER_SECONDS: ${GODFATHER_OFFLINE_AFTER_SECONDS:-30}
  GODFATHER_EXECUTION_LEASE_SECONDS: ${GODFATHER_EXECUTION_LEASE_SECONDS:-30}
  GODFATHER_SCHEDULER_ENABLED: ${GODFATHER_SCHEDULER_ENABLED:-true}
  GODFATHER_HEALTH_SCAN_SECONDS: ${GODFATHER_HEALTH_SCAN_SECONDS:-1}

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    environment: *api-environment
    volumes:
      - artifacts-data:/var/lib/godfather/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    environment: *api-environment
    command:
      [
        "python",
        "-m",
        "alembic",
        "-c",
        "infrastructure/migrations/alembic.ini",
        "upgrade",
        "head",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    environment:
      <<: *api-environment
      GODFATHER_ENVIRONMENT: test
      GODFATHER_DATABASE_NAME: godfather_test
      GODFATHER_RUN_INTEGRATION: "1"
      GODFATHER_ARTIFACT_DIRECTORY: /tmp/godfather-test-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - frontend

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: godfather
      POSTGRES_USER: godfather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godfather -d godfather"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7.4.11-bookworm
    user: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  artifacts-data:
