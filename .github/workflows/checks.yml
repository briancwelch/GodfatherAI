name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --locked --all-packages ruff format --check .
      - run: uv run --locked --all-packages ruff check .
      - run: uv run --locked --all-packages mypy
      - run: uv run --locked --all-packages pytest

  frontend:
    name: Dashboard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    name: Local containers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-disposable-environment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose config --quiet
      - run: docker compose --profile tools build dashboard api api-test migrate
      - run: docker compose up --wait --wait-timeout 90 postgres redis
      - run: docker compose --profile tools run --rm migrate
      - run: docker compose up --wait --wait-timeout 180
      - name: Check shell, Redis, and PostgreSQL persistence
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          docker compose exec -T postgres psql -U godfather -d godfather -v ON_ERROR_STOP=1 -c "CREATE TABLE phase01_environment_probe (value text NOT NULL); INSERT INTO phase01_environment_probe VALUES ('durable');"
          docker compose up --force-recreate --wait --wait-timeout 60 postgres
          test "$(docker compose exec -T postgres psql -U godfather -d godfather -Atc 'SELECT value FROM phase01_environment_probe')" = "durable"
          docker compose exec -T postgres psql -U godfather -d godfather -v ON_ERROR_STOP=1 -c 'DROP TABLE phase01_environment_probe'
      - name: Real PostgreSQL migration and API integration tests
        run: |
          docker compose exec -T postgres createdb -U godfather godfather_test
          docker compose --profile tools run --rm api-test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: API and PostgreSQL restart, outage and recovery
        run: python -m scripts.check_api_restart
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.1"
      - run: uv sync --locked --all-packages
      - name: Four worker processes, independent health, and node persistence
        run: uv run --locked --all-packages python -m scripts.check_worker_health
      - name: Durable scheduler, 100 jobs, two workers, restarts and lease expiry
        run: uv run --locked --all-packages python -m scripts.check_job_scheduler
      - name: Container diagnostics
        if: failure()
        run: docker compose ps --all
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down
